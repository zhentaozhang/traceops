# TraceOps P0 观测栈：Prometheus + Loki + Tempo + Grafana（+ Grafana MCP 所需）
#
# 用法:
#   docker compose up -d
#   Grafana      http://localhost:3000   (admin / admin)
#   Prometheus   http://localhost:9090
#   Loki         http://localhost:3100
#   Tempo        http://localhost:3200
#
# 说明: 这是"能接上适配器的最小集合"，不含 TicketFlow 业务服务与故障注入
# （见 技术验证记录 S4/S5，需要靶场代码就位后补）。
#
# **版本已钉死，不要用 :latest**。理由见 镜像说明：
# 本项目已因版本组合不匹配静默失效三次（Tempo 缺端点、mcp-grafana 走新路径、
# Tempo v3 改响应形状），而每次表现都是"证据凭空消失"而非报错。
# latest 会让"重建一次行为就变了"无法复现。

name: traceops-observability

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.5
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 8

  tempo:
    image: grafana/tempo:3.0.0
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
    ports:
      - "3200:3200"   # http query
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
    # **没有 healthcheck**：grafana/tempo:3.0.0 是 distroless 镜像 ——
    # 容器里没有 sh、没有 wget、没有 curl（实测 `which` 本身都不存在），
    # 所以任何 shell 形式的 healthcheck 都必然失败，并把服务标成 unhealthy，
    # 进而让 `depends_on: service_healthy` 的 grafana 起不来。
    #
    # 实测该镜像本身是**健康的**：`curl http://localhost:3200/ready` 返回 200。
    # 与其挂一个永远失败的探针（false negative，比没有更糟），
    # 不如让依赖方直接探测 HTTP —— 见 grafana 的 depends_on 用 service_started。
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # MCP 用只读 service account，这里先关闭匿名访问
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      # 用 service_started 而不是 service_healthy：tempo 镜像无法自探（见上）
      tempo:
        condition: service_started

  # Grafana MCP server：**独立二进制**，不是 Grafana 内置功能。
  # Grafana 11.0.0 / 11.1.0 都没有 /mcp 端点（实测 handler=notfound 404）；
  # 正确做法是单独运行 grafana/mcp-grafana 并指向 Grafana。
  mcp-grafana:
    image: grafana/mcp-grafana:2.1.1
    # 镜像自带 Entrypoint 是 `/app/mcp-grafana --transport sse ...`，
    # 直接写 command 会变成"在 sse 模式上叠加参数"，实际仍走 sse。
    # 必须用 entrypoint 覆盖，才能真正切到 streamable-http。
    entrypoint: ["/app/mcp-grafana"]
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000"]
    environment:
      GRAFANA_URL: http://grafana:3000
      # 必须是只读 Service Account（Viewer），不要用 admin
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SA_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      grafana:
        condition: service_started

volumes:
  grafana-data:
