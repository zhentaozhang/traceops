global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 观测栈自监控：没有靶场时，至少让指标链路有真实数据可验证。
# 靶场（订单/支付服务）就位后在这里追加业务 job。
#
# 为什么不能留空：留空时所有查询返回空结果，"查询链路是否工作"就无法验证——
# 空结果和"查询写错了"长得一模一样。
scrape_configs:
  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: loki-self
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
