[project]
name = "traceops-agent-runtime"
version = "0.1.0"
description = "TraceOps Agent Runtime: evidence engine, tool gateway, budget, RCA rules"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["traceops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
