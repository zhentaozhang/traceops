[project]
name = "traceops-agent-runtime"
version = "0.1.0"
description = "TraceOps Agent Runtime: evidence engine, tool gateway, budget, RCA rules"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.21",
    # 编排层（orchestration/graph.py）在导入期就依赖这两个包，
    # 不声明的话 `pip install -e agent-runtime` 装完跑不起来。
    "langchain-core>=1.0",
    "langgraph>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "referencing>=0.30"]
# RCAEval parquet 导入器用惰性导入的可选 pyarrow（见 evaluation/importers/rcaeval.py 文档字符串）。
# 不装也能跑，但导入器那 10 条测试会被跳过 —— CI 装它，让真实数据那条路长期有人看着。
datasets = ["pyarrow>=15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["traceops*"]

# 提示词是运行时读的数据文件，不是 Python 源码 —— 不声明就不会进 wheel，
# 于是"源码目录里能跑、装完就 PromptNotFound"。
[tool.setuptools.package-data]
"traceops.prompts" = ["*.md", "parts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
